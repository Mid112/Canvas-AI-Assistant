name: CI

on:
  # Only run on PRs targeting main/develop — not on every direct push.
  # This means CI runs once per PR (and again on each new commit pushed
  # to that PR), rather than on every single push to a branch.
  pull_request:
    branches: [main, develop]
  # Still run on direct pushes to main/develop themselves, since those
  # represent code actually landing in a protected branch.
  push:
    branches: [main, develop]

# Cancels older in-progress runs for the same branch/PR when a new
# commit is pushed. Prevents CI minutes being wasted on stale runs
# and means only the latest push actually finishes running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Helps setup-node use the runner's writable _work/_tool cache.
  # Note: setup-python on macOS always installs to /Users/runner/hostedtoolcache,
  # so backend jobs use the system Python instead (see setup steps below).
  RUNNER_TOOL_CACHE: ${{ github.workspace }}/../../_tool
  AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/../../_tool

jobs:
  # ── 0. Detect which parts of the repo changed ──────────
  # This lets backend-only changes skip frontend jobs and vice versa.
  changes:
    runs-on:
    - self-hosted
    - macOS
    - X64
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/backend/**'
              - 'test/backend/**'
            frontend:
              - 'app/frontend/**'
              - 'test/frontend/**'

  # ── 1. Backend lint + type check ──────────
  backend-lint:
    runs-on:
    - self-hosted
    - macOS
    - X64
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./app/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        run: |
          python3.12 --version
          python3.12 -m pip install --upgrade pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('app/backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-
      - name: Install dependencies
        run: python3.12 -m pip install -r requirements.txt ruff mypy
      - name: Lint
        run: python3.12 -m ruff check .
      - name: Type check
        # continue-on-error: true means mypy issues are visible in the
        # CI log and job summary, but won't block merges yet. Remove
        # this once the codebase has been typed-checked end to end
        # and you're ready to enforce it strictly.
        continue-on-error: true
        run: python3.12 -m mypy . --ignore-missing-imports

  # ── 2. Backend tests ──────────────────────
  backend-test:
    runs-on:
    - self-hosted
    - macOS
    - X64
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        # Service containers only work on Linux runners. On macOS self-hosted
        # runners, start Postgres via Docker instead.
        run: |
          CONTAINER="ci-postgres-${{ github.run_id }}"
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=testdb \
            -p 5434:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER" pg_isready -U testuser -d testdb >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL failed to start"
          docker logs "$CONTAINER"
          exit 1
      - name: Set up Python 3.12
        run: |
          python3.12 --version
          python3.12 -m pip install --upgrade pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('app/backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-
      - name: Install dependencies
        working-directory: ./app/backend
        run: python3.12 -m pip install -r requirements.txt
      - name: Run tests
        # Tests live in test/backend/ but import from app.backend.app,
        # so we run pytest from the repo root with PYTHONPATH set.
        run: PYTHONPATH=./app/backend python3.12 -m pytest test/backend/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5434/testdb
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret
          CANVAS_TOKEN_ENCRYPTION_KEY: cS_xtOdvX6UctctAErcx3JJC1e3YBBM-Kwh9WLY3ocI=
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f "ci-postgres-${{ github.run_id }}" 2>/dev/null || true

  # ── 3. Frontend lint + test ───────────────
  frontend-test:
    runs-on:
    - self-hosted
    - macOS
    - X64
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        # package.json test script proxies to test/frontend internally
        run: npm run test

  # ── 4. Docker build check ─────────────────
  # Only runs after both lint/test jobs succeed (or are skipped
  # because that part of the repo didn't change).
  docker-build:
    runs-on:
    - self-hosted
    - macOS
    - X64
    needs: [backend-test, frontend-test]
    if: always() && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: false
          tags: app-backend:test
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          push: false
          tags: app-frontend:test
      # MCP commented out until app/mcp/ has a Dockerfile.
      # Uncomment once MCP service is implemented.
      # - name: Build MCP image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: ./app/mcp
      #     push: false
      #     tags: app-mcp:test
