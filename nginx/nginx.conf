# ─────────────────────────────────────────────
# nginx/nginx.conf — Root Reverse Proxy
#
# This is the OUTER nginx, running as its own Docker service.
# Its job is to sit in front of everything and route incoming
# requests to the right internal service (frontend or backend).
#
# Users never talk to the frontend or backend directly —
# everything goes through this file first.
# ─────────────────────────────────────────────

server {
    # Listen on port 8080 internally.
    # We use 8080 (not 80) because nginx-unprivileged runs as a
    # non-root user and cannot bind to ports below 1024.
    # docker-compose maps this to port 80 externally, so users
    # still access the app at http://192.168.1.xx with no port number.
    listen 8080;

    # Accept requests for any hostname or IP address.
    # "_" is nginx's catch-all — works whether the user types an
    # IP address or a domain name.
    server_name _;

    # ── Frontend routing ──────────────────────────────────────
    # Any request that doesn't match a more specific block below
    # gets sent to the React frontend container.
    # try_files is not used here because this is a proxy, not a
    # file server — that logic lives in app/frontend/nginx.conf.
    location / {
        # Forward the request to the frontend container.
        # "frontend" resolves to the frontend service via Docker's
        # internal DNS — no IP address needed.
        proxy_pass http://frontend:8080;

        # Pass the original Host header so the frontend knows
        # what domain the user requested.
        proxy_set_header Host $host;

        # Pass the user's real IP address so logs show the actual
        # client, not the nginx container's internal IP.
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Backend API routing ───────────────────────────────────
    # Any request starting with /api/ gets sent to the FastAPI
    # backend instead of the frontend.
    # This is how the frontend and backend share one domain —
    # the URL prefix decides which service handles the request.
    location /api/ {
        # Forward to the backend FastAPI container on port 8000.
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Build a chain of IPs so the backend can trace the full
        # path the request took (user → nginx → backend).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Security headers ──────────────────────────────────────
    # These headers are added to every response nginx sends back.

    # Prevents this app from being embedded in an iframe on
    # another site — protects against clickjacking attacks.
    add_header X-Frame-Options "SAMEORIGIN";

    # Stops browsers from guessing the content type of a response.
    # Prevents certain injection attacks via uploaded files.
    add_header X-Content-Type-Options "nosniff";
}

