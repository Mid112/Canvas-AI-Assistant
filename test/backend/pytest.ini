[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    fuzz: property-based / fuzz tests (opt-in via make test-fuzz)
    requirement(id): the UR/FR this test demonstrates, e.g. @pytest.mark.requirement("FR10.4").
        Only tag a test that actually demonstrates the requirement (or a named part of
        it) on its own. A requirement with no tagged test is meant to show up as a gap
        in the traceability report rather than being quietly claimed as covered.
