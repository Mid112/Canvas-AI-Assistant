  # mcp:
  #   build:
  #     context: ./mcp
  #     dockerfile: Dockerfile
  #   container_name: app_mcp
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL:      postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-appdb}
  #     CANVAS_API_URL:    ${CANVAS_API_URL}
  #     CANVAS_API_TOKEN:  ${CANVAS_API_TOKEN}
  #     OLLAMA_HOST:       http://host.docker.internal:11434
  #     ALLOWED_MODELS:    ${ALLOWED_MODELS:-mistral,llama3,phi3}
  #     SCRUB_PII:         ${SCRUB_PII:-true}
