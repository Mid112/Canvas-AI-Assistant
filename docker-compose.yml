version: "3.9"

# ─────────────────────────────────────────────
#  NETWORKS
# ─────────────────────────────────────────────
networks:
  frontend_net:          # React ↔ FastAPI only
    driver: bridge
  backend_net:           # FastAPI ↔ MCP ↔ PostgreSQL
    driver: bridge
  ai_net:                # MCP ↔ Ollama only (air-gapped from Canvas/REST)
    driver: bridge
    internal: true       # no external egress from this network

# ─────────────────────────────────────────────
#  VOLUMES
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  ollama_models:         # persists pulled models between restarts
  mcp_cache:

# ─────────────────────────────────────────────
#  SERVICES
# ─────────────────────────────────────────────
services:

  # ── 1. PostgreSQL ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # seed / migration SQL files
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Postgres is NOT exposed externally; only backend_net services can reach it.

  # ── 2. MCP Server (sanitisation + AI gateway) ──
  #    Receives raw Canvas REST data, sanitises it, writes to Postgres,
  #    then forwards only clean payloads to Ollama.
  #    Canvas credentials NEVER leave this container.
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: app_mcp
    restart: unless-stopped
    environment:
      # Postgres connection
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-appdb}
      # Canvas API (only MCP has these)
      CANVAS_API_URL:   ${CANVAS_API_URL}
      CANVAS_API_TOKEN: ${CANVAS_API_TOKEN}
      # Ollama endpoint (ai_net only)
      OLLAMA_HOST: http://ollama:11434
      # Which models MCP is allowed to call
      ALLOWED_MODELS:   ${ALLOWED_MODELS:-mistral,llama3,phi3}
      # Sanitisation / PII scrubbing settings
      SCRUB_PII:        ${SCRUB_PII:-true}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-131072}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - backend_net      # talks to FastAPI + Postgres
      - ai_net           # talks to Ollama (isolated)
    volumes:
      - mcp_cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── 3. Ollama (LLM runtime) ─────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: app_ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ai_net           # ONLY ai_net — completely isolated from Canvas / REST layer
    # Ollama is intentionally NOT on frontend_net or backend_net.
    # Only the MCP server can reach it.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]   # remove if no GPU available
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── 4. Model Puller (one-shot init) ─────────
  #    Pulls requested models on first run, then exits.
  model_puller:
    image: ollama/ollama:latest
    container_name: app_model_puller
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        sleep 5 &&
        ollama pull ${MODEL_MISTRAL:-mistral} &&
        ollama pull ${MODEL_LLAMA:-llama3} &&
        ollama pull ${MODEL_PHI:-phi3}
      "
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - ai_net
    depends_on:
      ollama:
        condition: service_healthy

  # ── 5. FastAPI Backend ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: app_backend
    restart: unless-stopped
    environment:
      # Postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-appdb}
      # MCP endpoint (backend delegates all AI + Canvas work to MCP)
      MCP_BASE_URL: http://mcp:8001
      # App settings
      SECRET_KEY:         ${SECRET_KEY:-supersecretchangeme}
      ENVIRONMENT:        ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL:          ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks:
      - frontend_net     # serves React
      - backend_net      # reaches Postgres + MCP
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    # Backend intentionally has NO access to ai_net or Canvas credentials.

  # ── 6. React Frontend ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: app_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── 7. Nginx Reverse Proxy ───────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: app_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro    # mount TLS certs (Let's Encrypt / self-signed)
    depends_on:
      - frontend
      - backend
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
