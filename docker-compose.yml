# ─────────────────────────────────────────────
# docker-compose.yml
#
# Services:
#   1. postgres    — database
#   2. backend     — FastAPI Python API
#   3. mcp_server  — Canvas MCP server
#   4. frontend    — React app served by Nginx
#   5. nginx       — reverse proxy
#
# Networks:
#   frontend_net — nginx ↔ frontend ↔ backend
#   backend_net  — backend ↔ postgres ↔ mcp_server
#   ai_net       — mcp_server ↔ vLLM (internal, no external egress)
# ─────────────────────────────────────────────

services:
  # ─────────────────────────────────────────────
  # 1. PostgreSQL Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  # ─────────────────────────────────────────────
  # 2. Backend (FastAPI)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-appdb}
      SECRET_KEY: ${SECRET_KEY:-localdevsecret}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8888,http://localhost}
      CANVAS_API_URL: ${CANVAS_API_URL:-https://canvas.ubc.ca/api/v1}
      CANVAS_API_TOKEN: ${CANVAS_API_TOKEN:-}
      MCP_SERVER_URL: http://mcp_server:8001
      # VLLM_MODE=native → vLLM running on host Mac via Metal
      # VLLM_MODE=docker → vLLM running in container (slow, CPU only on Mac)
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}

      CANVAS_TOKEN_ENCRYPTION_KEY: ${CANVAS_TOKEN_ENCRYPTION_KEY}

    # Don't start backend until postgres passes its health check.
    # condition: service_healthy means it waits for pg_isready to
    # succeed, not just for the container to start.

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # ─────────────────────────────────────────────
  # 3. MCP Server (Canvas integration + AI gateway)
  # ─────────────────────────────────────────────
  mcp_server:
    build:
      context: ./app/mcp
      dockerfile: Dockerfile
    container_name: app_mcp
    restart: unless-stopped
    environment:
      CANVAS_API_URL: ${CANVAS_API_URL:-http://placeholder.local}
      CANVAS_API_TOKEN: ${CANVAS_API_TOKEN:-placeholder}
      BACKEND_URL: http://backend:8000
    ports:
      - "8001:8001"
    depends_on:
      - backend
    networks:
      - backend_net

  # ─────────────────────────────────────────────
  # 4. Frontend (React + Nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - frontend_net

  # ─────────────────────────────────────────────
  # 5. Nginx Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginxinc/nginx-unprivileged:alpine-slim
    restart: unless-stopped
    ports:
      # Using 8888 to avoid conflict with Canvas sandbox on port 80
      - "0.0.0.0:8888:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend_net

  # ── vLLM container ──────────────────────────
  # Only used when VLLM_MODE=docker.
  # On Mac Silicon this runs CPU only and is very slow.
  # For native Metal mode leave this commented and run vLLM manually.
  # When uncommenting also set VLLM_BASE_URL=http://vllm:8000 in .env
  #
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   container_name: app_vllm
  #   restart: unless-stopped
  #   environment:
  #     VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-4B}
  #   command: >
  #     --model ${VLLM_MODEL:-Qwen/Qwen3-4B}
  #     --host 0.0.0.0
  #     --port 8000
  #     --max-model-len 4096
  #   volumes:
  #     - ~/.cache/huggingface:/root/.cache/huggingface
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - ai_net

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  ai_net:
    driver: bridge
    internal: true # no external egress — for containerized vLLM

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
