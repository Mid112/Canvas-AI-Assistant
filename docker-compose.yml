# ─────────────────────────────────────────────
#  NETWORKS
# ─────────────────────────────────────────────
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  ai_net:
    driver: bridge
    internal: true      # no external egress in production
                        # remove internal: true during local dev if needed

# ─────────────────────────────────────────────
#  VOLUMES
# ─────────────────────────────────────────────
volumes:
  postgres_data:

# ─────────────────────────────────────────────
#  SERVICES
# ─────────────────────────────────────────────
services:

  # ── 1. PostgreSQL ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB:       ${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # exposed locally for pgAdmin / psql inspection
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama ─────────────────────────────────
  # Ollama runs NATIVELY on Mac (via the menu bar app) for Metal GPU acceleration.
  # It is reachable from any container via host.docker.internal:11434
  # When deploying to Linux, uncomment the ollama service below and set
  # OLLAMA_HOST: http://ollama:11434 in the mcp service.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: app_ollama
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_KEEP_ALIVE: "24h"
  #     OLLAMA_NUM_PARALLEL: "2"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   networks:
  #     - ai_net

  # ── 2. MCP Server ──────────────────────────
  # Uncomment once ./mcp/Dockerfile exists.
  # Canvas credentials live here only — never passed to backend or LLM.
  # OLLAMA_HOST points to native Mac Ollama via host.docker.internal.
