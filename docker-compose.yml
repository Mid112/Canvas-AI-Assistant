version: "3.9"

# ─────────────────────────────────────────────
#  NETWORKS
# ─────────────────────────────────────────────
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  ai_net:
    driver: bridge
    internal: true      # no external egress — Ollama is air-gapped

# ─────────────────────────────────────────────
#  VOLUMES
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  ollama_models:        # models persist between restarts

# ─────────────────────────────────────────────
#  SERVICES
# ─────────────────────────────────────────────
services:

  # ── 1. PostgreSQL ──────────────────────────
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB:       ${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # exposed locally so you can inspect with pgAdmin or psql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Ollama (LLM runtime) ─────────────────
  # Runs on ai_net only — no external egress.
  # On Mac Silicon it uses CPU inside Docker.
  # For GPU acceleration on Mac, run Ollama natively instead
  # and point MCP at http://host.docker.internal:11434
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    container_name: app_ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"   # exposed locally so you can test with curl
    networks:
      - ai_net

  # ── 3. Model puller (one-shot init) ─────────
  # Pulls one small model on first run then exits.
  # Pulling all three on first run takes a long time —
  # start with mistral only for the smoke test.
  model_puller:
    image: ollama/ollama:latest
    platform: linux/arm64
    container_name: app_model_puller
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for Ollama...' &&
        sleep 10 &&
        ollama pull ${MODEL_MISTRAL:-mistral} &&
        echo 'Model ready.'
      "
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - ai_net
    depends_on:
      - ollama

