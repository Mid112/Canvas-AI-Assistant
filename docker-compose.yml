  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - backend_net
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 3

